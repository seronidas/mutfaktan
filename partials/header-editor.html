<header class="topbar">
  <a href="{{href|index.html}}" class="brand">
    <div class="brand-icon">
{{#icon=back}}
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
{{/}}
{{^icon=back}}
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
        <line x1="6" y1="17" x2="18" y2="17"/>
      </svg>
{{/}}
    </div>
    <div>
      <div class="brand-title">Mutfaktan Yarına</div>
      <div class="brand-sub">{{sub}}</div>
    </div>
  </a>

  <div class="editor-identity">
    <span class="role-badge"{{id:badgeid}}>{{badge}}</span>
{{#session}}
    <div class="editor-info">
      <span class="editor-name" id="currentEditorName"></span>
      <span class="editor-mail" id="currentEditorMail"></span>
    </div>
    <a href="giris.html" class="btn-logout" id="btnLogout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Çıkış</span>
    </a>
{{/}}
  </div>
</header>
